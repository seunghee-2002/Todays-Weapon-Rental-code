<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Today's Weapon Rental — Admin</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Today's Weapon Rental — Admin</h1>
    <div class="actions">
      <span id="who"></span>
      <a id="loginLink" href="/auth/login" hidden>Google 로그인</a>
      <button id="logoutBtn" hidden>로그아웃</button>
    </div>
  </header>

  <main id="app">
    <!-- 미인증 안내 -->
    <section id="loggedOut" hidden>
      <p>운영자 계정으로 로그인해야 합니다.</p>
      <p><a href="/auth/login" class="btn primary">Google 로그인</a></p>
    </section>

    <!-- 인증 후 메인 UI -->
    <section id="loggedIn" hidden>
      <nav class="tabs">
        <button data-tab="search" class="tab active">플레이어 조회</button>
        <button data-tab="leaderboard" class="tab">리더보드</button>
      </nav>

      <!-- 플레이어 조회 탭 -->
      <section id="tab-search" class="tab-panel active">
        <div class="row">
          <input id="playerIdInput" placeholder="PlayerId (28자)" maxlength="64" />
          <button id="searchBtn" class="btn">조회</button>
        </div>
        <div id="playerResult" class="card" hidden></div>
      </section>

      <!-- 리더보드 탭 -->
      <section id="tab-leaderboard" class="tab-panel">
        <div class="row">
          <button id="reloadLbBtn" class="btn">새로고침 (상위 100)</button>
          <span id="lbMeta" class="meta"></span>
        </div>
        <table id="lbTable" class="lb-table">
          <thead>
            <tr><th>#</th><th>Nickname</th><th>PlayerId</th><th>Score</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </section>
  </main>

  <!-- BAN 모달 -->
  <div id="banModal" class="modal" hidden>
    <div class="modal-body">
      <h3>BAN 적용</h3>
      <p>PlayerId: <code id="banModalPid"></code></p>
      <label>사유<br/>
        <input id="banReason" type="text" maxlength="200" placeholder="예: 치트 사용" />
      </label>
      <label>만료 시각 (선택, 비우면 영구)<br/>
        <input id="banUntil" type="datetime-local" />
      </label>
      <div class="modal-actions">
        <button id="banCancel" class="btn">취소</button>
        <button id="banConfirm" class="btn danger">BAN</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
